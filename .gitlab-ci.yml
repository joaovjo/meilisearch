variables:
  COMPOSER_ALLOW_SUPERUSER: "1"

# Pest 4.x requires PHP 8.3+, so the test/lint pipeline runs on PHP 8.3.
# PHP version compatibility down to 8.1 is still verified statically by
# PHPCompatibility (see testVersion in .phpcs.xml.dist).

before_script:
  # System packages
  - apt-get -yqq update
  - apt-get -yqqf install zip unzip git --fix-missing

  # Install Composer
  - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
  - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
  - php -r "unlink('composer-setup.php');"

  # Install project dependencies (Pest + tooling)
  - composer install --no-interaction --prefer-dist

  # Install PHPCS + WordPress Coding Standards
  - composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
  - composer global require "squizlabs/php_codesniffer" "wp-coding-standards/wpcs" "phpcompatibility/phpcompatibility-wp"
  - export PATH="$PATH:$HOME/.composer/vendor/bin:$HOME/.config/composer/vendor/bin"
  - phpcs --version

Pest:PHP8.3:
  image: php:8.3-bookworm
  script:
    - phpcs
    - vendor/bin/pest
